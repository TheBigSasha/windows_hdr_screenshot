name: CI

on:
  workflow_call:
  push:
    branches: [main, release-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full gate on Windows: lint + types + tests + the synthetic HDR selftest.
  # (Real DXGI capture can't run — hosted runners have no interactive desktop —
  #  which is exactly why the synthetic selftest path exists.)
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create venv and install
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install -e .[dev]
      - name: Ruff (lint)
        run: .venv/Scripts/python -m ruff check .
      - name: Pyright (type check)
        # Run once, on 3.12: the latest imagecodecs (with the nclx kwargs used by
        # the HDR-AVIF encoder) has no 3.10 wheel, so an older stub there yields
        # spurious signature errors.
        if: matrix.python == '3.12'
        run: .venv/Scripts/python -m pyright
      - name: Pytest
        run: .venv/Scripts/python -m pytest -q
      - name: Selftest (synthetic HDR encode path)
        run: .venv/Scripts/python -m hdrshot selftest --out selftest-artifacts
      - name: Upload selftest artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest-${{ matrix.python }}
          path: selftest-artifacts/
          if-no-files-found: warn

  # The cross-platform seam (issue #14): the pure package imports and the
  # math/encoder tests pass off-Windows. This job would have been impossible
  # before the backend seam (import-time ctypes.windll died here).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
      - name: Create venv and install (base + dev tools, no Win32)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[avif-hdr] pytest ruff
      - name: Ruff
        run: .venv/bin/python -m ruff check .
      - name: Pytest (pure math + encoders + import isolation)
        run: .venv/bin/python -m pytest -q
      - name: Selftest runs off-Windows
        run: .venv/bin/python -m hdrshot selftest --out selftest-linux

  # Do not use a broad ARM64 exclusion marker for optional codecs. This lane
  # proves the current native imagecodecs wheel is exercised on the target.
  windows-arm64-codecs:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Install and probe the native HDR AVIF profile
        shell: bash
        run: |
          python -m pip install -e .[avif-hdr] pytest
          python -c "from hdrshot.codecs import capability; c = capability('pq-avif'); assert c.available, c"
          python -m pytest -q tests/test_avif_hdr.py

  # PR packaging gate: this deliberately builds and verifies both native
  # artifacts, but never creates/uploads a release. The matrix is kept here
  # so the release workflow's reusable quality gate exercises the same graph.
  package-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            python_arch: x64
            asset_arch: x64
            asset_suffix: win64
          - runner: windows-11-arm
            python_arch: arm64
            asset_arch: arm64
            asset_suffix: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up native Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Write CI capability contract
        shell: pwsh
        run: |
          $manifest = @{
            schema_version = 1
            architecture = '${{ matrix.asset_arch }}'
            expected_profiles = @('uhdr-jpeg', 'png', 'jpeg')
          } | ConvertTo-Json -Depth 4
          $manifest | Set-Content -Encoding utf8 packaging/bundle-capabilities.json

      - name: Install locked packaging environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -c packaging/constraints-release.txt ".[gui]" pyinstaller
          python -m pip check

      - name: Build native PyInstaller bundle
        working-directory: packaging
        run: pyinstaller hdrshot.spec --noconfirm --clean

      - name: Assemble a non-publishing archive
        shell: pwsh
        run: |
          $version = (& python -c "import hdrshot; print(hdrshot.__version__)").Trim()
          $name = "HDRShot-$version-${{ matrix.asset_suffix }}"
          $output = Join-Path $PWD ci-package-artifacts
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md packaging/dist/HDRShot/
          Copy-Item packaging/bundle-capabilities.json packaging/dist/HDRShot/
          $archive = Join-Path $output "$name.zip"
          Compress-Archive -Path packaging/dist/HDRShot -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Verify the exact non-publishing archive
        shell: pwsh
        run: |
          $version = (& python -c "import hdrshot; print(hdrshot.__version__)").Trim()
          $archive = Join-Path $PWD "ci-package-artifacts/HDRShot-$version-${{ matrix.asset_suffix }}.zip"
          ./packaging/verify_bundle.ps1 -Archive $archive -ExpectedVersion $version -ExpectedArchitecture '${{ matrix.asset_arch }}' -OutputDirectory ci-package-verification

      - name: Upload short-retention internal package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-bundle-${{ matrix.asset_arch }}
          path: ci-package-artifacts/
          if-no-files-found: error
          retention-days: 3

  # PR metadata gate: consume the exact two package artifacts above and validate
  # artifact-derived SBOMs plus the complete three-file WinGet shape. This job
  # has no contents/attestation permissions and never publishes anything.
  validate-release-metadata:
    needs: package-verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
      - name: Download exact internal package artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: ci-bundle-*
          path: metadata-input
          merge-multiple: true
      - name: Validate SBOM and WinGet metadata from exact archives
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem metadata-input -Recurse -File -Filter 'HDRShot-*.zip')
          if ($archives.Count -ne 2) { throw "expected two architecture archives, found $($archives.Count)" }
          $version = [IO.Path]::GetFileNameWithoutExtension($archives[0].Name)
          $version = $version -replace '^HDRShot-', ''
          $version = $version -replace '-win-arm64$', ''
          $version = $version -replace '-win64$', ''
          $x64 = $archives | Where-Object Name -eq "HDRShot-$version-win64.zip"
          $arm = $archives | Where-Object Name -eq "HDRShot-$version-win-arm64.zip"
          if (-not $x64 -or -not $arm) { throw 'both exact architecture archives are required' }
          $sbomDir = Join-Path $PWD metadata-sboms
          New-Item -ItemType Directory -Path $sbomDir -Force | Out-Null
          foreach ($archive in @($x64, $arm)) {
            $extract = Join-Path $sbomDir ([IO.Path]::GetFileNameWithoutExtension($archive.Name))
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
            $sbom = Join-Path $sbomDir ($archive.Name + '.sbom.spdx.json')
            python packaging/generate_sbom.py --bundle (Join-Path $extract 'HDRShot') --out $sbom --validate
          }
          $urlBase = "https://github.com/TheBigSasha/windows_hdr_screenshot/actions/runs/$env:GITHUB_RUN_ID/artifacts"
          python packaging/generate_winget.py --version $version `
            --x64-url "$urlBase/bundle-x64" --arm64-url "$urlBase/bundle-arm64" `
            --x64-archive $x64.FullName --arm64-archive $arm.FullName `
            --out-dir metadata-winget --validate

  # Provider lanes are intentionally separate from the minimal/frozen absence
  # lanes above. Each lane installs one exact optional extra and then runs its
  # complete round-trip tests; a broken import cannot become a green skip.
  windows-optional-providers:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: exr
            tests: tests/test_encoders.py tests/test_agentcli.py
          - extra: avif-sdr
            tests: tests/test_encoders.py -k avif_sdr
          - extra: avif-hdr
            tests: tests/test_avif_hdr.py tests/test_followup_review.py -k 'avif or cicp'
          - extra: heic
            tests: tests/test_followup_review.py -k heic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
      - name: Install provider lane
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[${{ matrix.extra }}]" pytest
          python -c "from hdrshot.codecs import capability; c = capability('${{ matrix.extra == 'avif-hdr' && 'pq-avif' || matrix.extra }}'); assert c.available, c"
      - name: Run provider round-trip tests
        shell: pwsh
        run: python -m pytest -q ${{ matrix.tests }}
, ''
          $version = $version -replace '-win64
          $x64 = $archives | Where-Object Name -eq "HDRShot-$version-win64.zip"
          $arm = $archives | Where-Object Name -eq "HDRShot-$version-win-arm64.zip"
          if (-not $x64 -or -not $arm) { throw 'both exact architecture archives are required' }
          $sbomDir = Join-Path $PWD metadata-sboms
          New-Item -ItemType Directory -Path $sbomDir -Force | Out-Null
          foreach ($archive in @($x64, $arm)) {
            $extract = Join-Path $sbomDir ([IO.Path]::GetFileNameWithoutExtension($archive.Name))
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
            $sbom = Join-Path $sbomDir ($archive.Name + '.sbom.spdx.json')
            python packaging/generate_sbom.py --bundle (Join-Path $extract 'HDRShot') --out $sbom --validate
          }
          $urlBase = "https://github.com/TheBigSasha/windows_hdr_screenshot/actions/runs/$env:GITHUB_RUN_ID/artifacts"
          python packaging/generate_winget.py --version $version `
            --x64-url "$urlBase/bundle-x64" --arm64-url "$urlBase/bundle-arm64" `
            --x64-archive $x64.FullName --arm64-archive $arm.FullName `
            --out-dir metadata-winget --validate

  # Provider lanes are intentionally separate from the minimal/frozen absence
  # lanes above. Each lane installs one exact optional extra and then runs its
  # complete round-trip tests; a broken import cannot become a green skip.
  windows-optional-providers:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: exr
            tests: tests/test_encoders.py tests/test_agentcli.py
          - extra: avif-sdr
            tests: tests/test_encoders.py -k avif_sdr
          - extra: avif-hdr
            tests: tests/test_avif_hdr.py tests/test_followup_review.py -k 'avif or cicp'
          - extra: heic
            tests: tests/test_followup_review.py -k heic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
      - name: Install provider lane
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[${{ matrix.extra }}]" pytest
          python -c "from hdrshot.codecs import capability; c = capability('${{ matrix.extra == 'avif-hdr' && 'pq-avif' || matrix.extra }}'); assert c.available, c"
      - name: Run provider round-trip tests
        shell: pwsh
        run: python -m pytest -q ${{ matrix.tests }}
, ''
          if (-not $version) { throw 'could not derive package version' }
          $x64 = $archives | Where-Object Name -eq "HDRShot-$version-win64.zip"
          $arm = $archives | Where-Object Name -eq "HDRShot-$version-win-arm64.zip"
          if (-not $x64 -or -not $arm) { throw 'both exact architecture archives are required' }
          $sbomDir = Join-Path $PWD metadata-sboms
          New-Item -ItemType Directory -Path $sbomDir -Force | Out-Null
          foreach ($archive in @($x64, $arm)) {
            $extract = Join-Path $sbomDir ([IO.Path]::GetFileNameWithoutExtension($archive.Name))
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
            $sbom = Join-Path $sbomDir ($archive.Name + '.sbom.spdx.json')
            python packaging/generate_sbom.py --bundle (Join-Path $extract 'HDRShot') --out $sbom --validate
          }
          $urlBase = "https://github.com/TheBigSasha/windows_hdr_screenshot/actions/runs/$env:GITHUB_RUN_ID/artifacts"
          python packaging/generate_winget.py --version $version `
            --x64-url "$urlBase/bundle-x64" --arm64-url "$urlBase/bundle-arm64" `
            --x64-archive $x64.FullName --arm64-archive $arm.FullName `
            --out-dir metadata-winget --validate

  # Provider lanes are intentionally separate from the minimal/frozen absence
  # lanes above. Each lane installs one exact optional extra and then runs its
  # complete round-trip tests; a broken import cannot become a green skip.
  windows-optional-providers:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: exr
            tests: tests/test_encoders.py tests/test_agentcli.py
          - extra: avif-sdr
            tests: tests/test_encoders.py -k avif_sdr
          - extra: avif-hdr
            tests: tests/test_avif_hdr.py tests/test_followup_review.py -k 'avif or cicp'
          - extra: heic
            tests: tests/test_followup_review.py -k heic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
      - name: Install provider lane
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[${{ matrix.extra }}]" pytest
          python -c "from hdrshot.codecs import capability; c = capability('${{ matrix.extra == 'avif-hdr' && 'pq-avif' || matrix.extra }}'); assert c.available, c"
      - name: Run provider round-trip tests
        shell: pwsh
        run: python -m pytest -q ${{ matrix.tests }}
