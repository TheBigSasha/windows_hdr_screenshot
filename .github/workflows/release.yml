name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Build and verification jobs are read-only. Only the final tag-gated publish
# job receives contents:write and the attestation permissions.
permissions:
  contents: read

env:
  EXPECTED_PROFILES: uhdr-jpeg,png,jpeg

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            python_arch: x64
            asset_arch: x64
            asset_suffix: win64
          - runner: windows-11-arm
            python_arch: arm64
            asset_arch: arm64
            asset_suffix: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up native Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Validate tag and package identity
        shell: pwsh
        run: |
          $runtime = (& python -c "import hdrshot; print(hdrshot.__version__)").Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($runtime -cne $tagVersion) { throw "tag $tagVersion != runtime $runtime" }
          }
          if ((Get-Content pyproject.toml -Raw) -notmatch 'dynamic = \["version"\]') {
            throw 'package metadata is not single-sourced from runtime version'
          }

      - name: Write frozen capability contract
        shell: pwsh
        run: |
          $manifest = @{
            schema_version = 1
            architecture = '${{ matrix.asset_arch }}'
            expected_profiles = @('uhdr-jpeg', 'png', 'jpeg')
          } | ConvertTo-Json -Depth 4
          $manifest | Set-Content -Encoding utf8 packaging/bundle-capabilities.json

      - name: Install locked release environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -c packaging/constraints-release.txt ".[gui]" pyinstaller
          python -m pip check

      - name: Build native onedir bundle
        working-directory: packaging
        run: pyinstaller hdrshot.spec --noconfirm --clean

      - name: Assemble and smoke-test release artifact
        shell: pwsh
        run: |
          $version = (& python -c "import hdrshot; print(hdrshot.__version__)").Trim()
          $name = "HDRShot-$version-${{ matrix.asset_suffix }}"
          $releaseDir = Join-Path $PWD "release-artifacts"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md packaging/dist/HDRShot/
          Copy-Item packaging/bundle-capabilities.json packaging/dist/HDRShot/
          $licensePath = Join-Path $releaseDir 'LICENSE.LGPL-3.0.txt'
          Invoke-WebRequest -Uri 'https://www.gnu.org/licenses/lgpl-3.0.txt' -OutFile $licensePath
          $licenseHash = (Get-FileHash -LiteralPath $licensePath -Algorithm SHA256).Hash
          if ($licenseHash -ne 'E3A994D82E644B03A792A930F574002658412F62407F5FEE083F2555C5F23118') {
            throw "LGPL text digest changed: $licenseHash"
          }
          Copy-Item $licensePath packaging/dist/HDRShot/
          Compress-Archive -Path packaging/dist/HDRShot -DestinationPath (Join-Path $releaseDir "$name.zip")
          $zip = Join-Path $releaseDir "$name.zip"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii (Join-Path $releaseDir "$name.zip.sha256")
          & packaging/dist/HDRShot/hdrshot-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI version smoke test failed' }

      - name: Generate dependency SBOM
        shell: pwsh
        run: |
          $version = (& python -c "import hdrshot; print(hdrshot.__version__)").Trim()
          $name = "HDRShot-$version-${{ matrix.asset_suffix }}"
          $extract = Join-Path $PWD "release-artifacts/sbom-$name"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath "release-artifacts/$name.zip" -DestinationPath $extract
          python packaging/generate_sbom.py --bundle (Join-Path $extract 'HDRShot') --out "release-artifacts/$name.sbom.spdx.json" --validate
          Remove-Item -LiteralPath $extract -Recurse -Force

      - name: Verify the freshly built archive on its native runner
        shell: pwsh
        run: |
          $version = (& python -c "import hdrshot; print(hdrshot.__version__)").Trim()
          $archive = Join-Path $PWD "release-artifacts/HDRShot-$version-${{ matrix.asset_suffix }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "missing $archive" }
          ./packaging/verify_bundle.ps1 -Archive $archive -ExpectedVersion $version -ExpectedArchitecture '${{ matrix.asset_arch }}' -OutputDirectory release-artifacts/build-verification

      - name: Upload internal artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.asset_arch }}
          path: |
            release-artifacts/HDRShot-*.zip
            release-artifacts/HDRShot-*.zip.sha256
            release-artifacts/HDRShot-*.sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset_arch: x64
            asset_suffix: win64
          - runner: windows-11-arm
            asset_arch: arm64
            asset_suffix: win-arm64
    # Verification is native too: a Windows x64 verifier must not be allowed
    # to certify the ARM64 artifact (or vice versa).
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            packaging/verify_bundle.ps1

      - name: Download exact internal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-${{ matrix.asset_arch }}
          path: downloaded

      - name: Extract and verify exact archive bytes
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem downloaded -File -Filter "HDRShot-*-${{ matrix.asset_suffix }}.zip")
          if ($archives.Count -ne 1) { throw "expected exactly one ${{ matrix.asset_arch }} archive, found $($archives.Count)" }
          $archive = $archives[0]
          $nameMatch = [regex]::Match($archive.Name, '^HDRShot-(.+)-${{ matrix.asset_suffix }}\.zip$')
          if (-not $nameMatch.Success) { throw "could not derive package version from $($archive.Name)" }
          $version = $nameMatch.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $version -cne $env:GITHUB_REF_NAME.Substring(1)) {
            throw "archive version $version does not exactly match tag $($env:GITHUB_REF_NAME)"
          }
          ./packaging/verify_bundle.ps1 -Archive $archive.FullName -ExpectedVersion $version -ExpectedArchitecture '${{ matrix.asset_arch }}' -OutputDirectory verification

  publish-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify]
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release metadata and verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download both verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: release-assets
          merge-multiple: true

      - name: Validate exact tag identity
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $x64 = @(Get-ChildItem release-assets -File -Filter "HDRShot-$version-win64.zip")
          $arm = @(Get-ChildItem release-assets -File -Filter "HDRShot-$version-win-arm64.zip")
          if ($x64.Count -ne 1 -or $arm.Count -ne 1) { throw 'exactly one archive for each architecture is required' }
          if ($x64[0].Name -cne "HDRShot-$version-win64.zip" -or
              $arm[0].Name -cne "HDRShot-$version-win-arm64.zip") {
            throw "archive names do not exactly match tag version $version"
          }

      - name: Create WinGet manifests from exact archive hashes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $tag = $env:GITHUB_REF_NAME
          $urlBase = "https://github.com/TheBigSasha/windows_hdr_screenshot/releases/download/$tag"
          $x64 = Get-Item "release-assets/HDRShot-$version-win64.zip"
          $arm = Get-Item "release-assets/HDRShot-$version-win-arm64.zip"
          $x64Hash = (Get-FileHash $x64.FullName -Algorithm SHA256).Hash
          $armHash = (Get-FileHash $arm.FullName -Algorithm SHA256).Hash
          $winget = Join-Path $PWD 'winget-generated'
          New-Item -ItemType Directory -Path $winget -Force | Out-Null
          python packaging/generate_winget.py --version $version `
            --x64-url "$urlBase/$($x64.Name)" --arm64-url "$urlBase/$($arm.Name)" `
            --x64-archive $x64.FullName --arm64-archive $arm.FullName `
            --out-dir $winget --validate
          Compress-Archive -Path "$winget/*" -DestinationPath "release-assets/TheBigSasha.HDRShot.$version.winget.zip"
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw 'no release assets were prepared' }
          $assets | Set-Content -Encoding utf8 release-assets.txt

      - name: Generate signed build provenance for both archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/HDRShot-*.zip

      - name: Create a draft release only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          @"
          Standalone Windows builds of HDR Shot $version.

          Assets are native x64 and ARM64 onedir bundles. They are kept in draft
          until the uploaded bytes pass the same archive verifier used by CI.
          Use HDRShot\\HDRShot.exe for the GUI or HDRShot\\hdrshot-cli.exe for scripts.
          "@ | Set-Content -Encoding utf8 release-notes.md
          gh release create $tag --draft --verify-tag --title "HDR Shot $version" --notes-file release-notes.md

      - name: Upload exact assets to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-Content -LiteralPath release-assets.txt)
          gh release upload $env:GITHUB_REF_NAME $assets --clobber

  verify-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-draft
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset_arch: x64
            asset_suffix: win64
          - runner: windows-11-arm
            asset_arch: arm64
            asset_suffix: win-arm64
    # The draft asset is verified on the same native runner family that built
    # it, including the packaged Qt smoke path in verify_bundle.ps1.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            packaging/verify_bundle.ps1

      - name: Download exact uploaded draft bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $dir = Join-Path $PWD draft-verification
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $archiveName = "HDRShot-$version-${{ matrix.asset_suffix }}.zip"
          gh release download $tag --dir $dir --pattern $archiveName --pattern "$archiveName.sha256"
          $archives = @(Get-ChildItem $dir -File -Filter $archiveName)
          if ($archives.Count -ne 1) { throw "expected one uploaded $archiveName" }
          ./packaging/verify_bundle.ps1 -Archive $archives[0].FullName -ExpectedVersion $version -ExpectedArchitecture '${{ matrix.asset_arch }}' -OutputDirectory (Join-Path $dir "verified-${{ matrix.asset_arch }}")

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-draft
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft as the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false

      - name: Re-download and verify public release hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $dir = Join-Path $PWD published-verification
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir $dir --pattern "HDRShot-$version-win64.zip" --pattern "HDRShot-$version-win64.zip.sha256" --pattern "HDRShot-$version-win-arm64.zip" --pattern "HDRShot-$version-win-arm64.zip.sha256"
          $archives = @(Get-ChildItem $dir -File -Filter "HDRShot-$version-*.zip")
          if ($archives.Count -ne 2) { throw "expected exactly two public architecture archives" }
          foreach ($zip in $archives) {
            $sidecar = "$($zip.FullName).sha256"
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "missing public sidecar for $($zip.Name)" }
            $lines = @(Get-Content -LiteralPath $sidecar | Where-Object { $_.Trim() -ne '' })
            if ($lines.Count -ne 1) { throw "invalid public sidecar for $($zip.Name)" }
            $match = [regex]::Match($lines[0].Trim(), '^(?<hash>[0-9A-Fa-f]{64})\s+\*?(?<name>\S+)$')
            if (-not $match.Success -or $match.Groups['name'].Value -cne $zip.Name) { throw "invalid public sidecar record for $($zip.Name)" }
            $expected = $match.Groups['hash'].Value.ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "public hash mismatch for $($zip.Name)" }
          }
