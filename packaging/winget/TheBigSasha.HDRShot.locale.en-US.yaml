ShortDescription: True HDR screenshots on Windows — gain-map UltraHDR JPEG, OpenEXR and more.
Description: |-
  HDR Shot captures the desktop in scRGB FP16 (the color space Windows composites
  HDR in) and saves it with highlights intact — as a gain-map UltraHDR JPEG,
  OpenEXR, 10-bit PQ HEIC or AVIF — with PNG/JPEG/AVIF SDR fallbacks. Includes a
  Snipping-Tool-style capture UI and a machine-readable CLI for agents.
